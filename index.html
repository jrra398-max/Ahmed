<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>NOIR Admin</title><style>body{margin:0;background:#050505;color:#fff;font:14px Arial;padding:40px}h1{font-weight:400}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #222;padding:14px;text-align:left}.card{border:1px solid #222;padding:20px;margin:20px 0}</style></head><body><h1>NOIR ADMIN</h1><div class="card"><h2>Orders</h2><div id="orders"></div></div><script>const orders=JSON.parse(localStorage.getItem("noir-orders")||"[]");document.getElementById("orders").innerHTML=orders.length?'<table><tr><th>ID</th><th>Customer</th><th>Total</th><th>Status</th></tr>'+orders.map(o=>'<tr><td>'+o.id+'</td><td>'+o.customer.name+'</td><td>$'+o.total.toFixed(2)+'</td><td>'+o.status+'</td></tr>').join("")+'</table>':'No orders yet.';</script></body></html>
